name: Release
# Push a `v*` tag to build for every OS, then publish a single draft release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # electron-builder names artifacts and update metadata from package.json,
      # not the tag. Fail loudly if they disagree so we never ship a v-tag whose
      # assets carry the previous version. Fix with `npm version` before tagging.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Run 'npm version' before tagging."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Compile (typecheck + vite build)
        run: npm run build
        env:
          MAIN_VITE_MANIFEST_URL: ${{ secrets.MAIN_VITE_MANIFEST_URL }}

      # --publish never: build/sign/notarize only. No race, no upload here.
      - name: Package (macOS arm64)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      # Upload every artifact the release needs, including the auto-updater's
      # latest*.yml and .blockmap files. Errors loudly if a build made nothing.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.yml
            dist/*.blockmap

  release:
    name: Publish draft release
    needs: build            # waits for all three; runs once
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create / update draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true       # matches your "promote manually" workflow
          files: artifacts/**
          fail_on_unmatched_files: true
